name: Generar láminas del carrusel

on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/render.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar HTML (descarga las fuentes de Google Fonts)
        run: python3 tools/gen.py

      - name: Captura de cada lámina con Chrome
        run: |
          mkdir -p png founder-gps
          for i in 01 02 03 04 05 06 07 08 09; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size=1080,1350 --virtual-time-budget=6000 \
              --screenshot="$PWD/png/lamina-$i.png" "file://$PWD/html/ig-$i.html"
          done
          ls -la png

      - name: Convertir a JPEG de 1080 x 1350
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image
          for i in range(1, 10):
              im = Image.open(f"png/lamina-{i:02d}.png").convert("RGB")
              if im.size != (1080, 1350):
                  im = im.resize((1080, 1350), Image.LANCZOS)
              im.save(f"founder-gps/lamina-{i:02d}.jpg", "JPEG", quality=90, optimize=True)
              print(i, im.size)
          EOF

      - name: Guardar las láminas en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add founder-gps
          git diff --cached --quiet || git commit -m "Láminas del carrusel Founder GPS (JPEG 1080x1350)"
          git push
